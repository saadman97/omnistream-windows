appId: com.omnistream.app
productName: OmniStream
copyright: Copyright © 2026 OmniStream Team

directories:
  output: dist
  buildResources: build

files:
  - "**/*"
  - "!dist/**"
  - "!scratch/**"
  - "!.agents/**"
  - "!test/**"

mac:
  category: public.app-category.video
  target:
    - target: dir
      arch:
        - arm64
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
  icon: icons/icon512.png
  hardenedRuntime: false
  gatekeeperAssess: false

win:
  target:
    - nsis
    - portable
  icon: icons/icon512.png

linux:
  target:
    - AppImage
    - tar.gz
  category: Video
